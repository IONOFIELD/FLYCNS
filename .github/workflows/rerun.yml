name: real-data rerun
# The real-connectome reruns, on GitHub's Windows machines instead of a personal computer. Needs the
# repository secret NEUPRINT_TOKEN. Start them by pushing a branch:
#   rerun/<label>             every rerun listed in RERUNS below
#   rerun/<label>--a+b        only the named ones, e.g. rerun/2026-10-11--flight-robustness+core
#
#   data          setup.cmd as a user runs it: environment, connectome from neuPrint (about 6 minutes),
#                 checked against the committed data/MANIFEST.json. The tables (never the manifest)
#                 are cached for the run's other jobs; GitHub keeps a cache per branch.
#   transmitters  menu 24: per-T-bar transmitter table (2.7 GB from Google Storage), cached likewise.
#   run           one machine per rerun, all at once. Each pushes its results (and its console log,
#                 ci-log.txt) to the branch rerun-out/<run number>/<name>. Nothing reaches main until
#                 the maintainer has reviewed and merged it.
on:
  push:
    branches: ["rerun/**"]

permissions:
  contents: read       # jobs that push their own rerun-out branch ask for write themselves

concurrency:
  group: rerun-${{ github.ref }}
  cancel-in-progress: false   # a long rerun is never cancelled by a later push

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  # name: the job and its rerun-out branch; run: arguments to the environment's Python; nt: needs menu 24;
  # manual: runs only when named in the branch (pin-data rewrites data/MANIFEST.json for review)
  RERUNS: |
    [
      {"name": "core",                      "run": "scripts/canonical_rerun.py"},
      {"name": "gf-adapt",                  "run": "benchmarks/fit_gf_adapt.py 40"},
      {"name": "a2",                        "run": "benchmarks/a2_registered.py 120"},
      {"name": "a2-robustness",             "run": "benchmarks/a2_robustness.py 100"},
      {"name": "dnp31",                     "run": "benchmarks/dnp31_trace.py"},
      {"name": "auditory-wing",             "run": "benchmarks/auditory_wing_trace.py"},
      {"name": "peptide-asta",              "run": "benchmarks/peptide_asta.py 10"},
      {"name": "flight-robustness",         "run": "benchmarks/flight_snpp16_robustness.py 400", "nt": true},
      {"name": "flight-loop",               "run": "benchmarks/flight_loop.py 400"},
      {"name": "sensitivity-flight",        "run": "benchmarks/sensitivity_flight.py 400"},
      {"name": "flight-snpp16",             "run": "benchmarks/flight_snpp16.py 400"},
      {"name": "flight-graded",             "run": "benchmarks/flight_snpp16_graded.py 400"},
      {"name": "pc1-song",                  "run": "benchmarks/pc1_song.py 10"},
      {"name": "dnp13-control",             "run": "benchmarks/dnp13_control.py 10"},
      {"name": "feeding-by-modality",       "run": "benchmarks/feeding_by_modality.py 6"},
      {"name": "gustatory-map",             "run": "benchmarks/gustatory_signed_map.py"},
      {"name": "sugar-laterality",          "run": "benchmarks/sugar_laterality.py"},
      {"name": "check-modulators",          "run": "fit/check_modulators.py"},
      {"name": "fit-regional",              "run": "benchmarks/fit_regional.py 6"},
      {"name": "fit-baseline",              "run": "benchmarks/fit_baseline.py 6"},
      {"name": "fit-gains",                 "run": "benchmarks/fit_gains.py 6"},
      {"name": "sensitivity-cord",          "run": "benchmarks/sensitivity_cord.py 20"},
      {"name": "embodiment-gate",           "run": "benchmarks/embodiment_gate.py"},
      {"name": "feeding-mechanism",         "run": "benchmarks/feeding_mechanism.py"},
      {"name": "diagnose-feeding",          "run": "benchmarks/diagnose_feeding.py"},
      {"name": "screen-50hz",               "run": "benchmarks/screen_afferents.py 3 data 50 0.3"},
      {"name": "screen-200hz",              "run": "benchmarks/screen_afferents.py 3 data 200 0.3"},
      {"name": "screen-w045",               "run": "benchmarks/screen_afferents.py 3 data 50 0.45 aPhM2a,aPhM5,TPMN1,PhG1c,BM_Taste,claw_tpGRN,JO-FV,BM_Vib"},
      {"name": "screen-w06",                "run": "benchmarks/screen_afferents.py 3 data 50 0.6 aPhM2a,aPhM5,TPMN1,PhG1c,BM_Taste,claw_tpGRN,JO-FV,BM_Vib"},
      {"name": "screen-w075",               "run": "benchmarks/screen_afferents.py 3 data 50 0.75 aPhM2a,aPhM5,TPMN1,PhG1c,BM_Taste,claw_tpGRN,JO-FV,BM_Vib"},
      {"name": "screen-w1",                 "run": "benchmarks/screen_afferents.py 3 data 50 1.0"},
      {"name": "export-brainsets",          "run": "scripts/export_brainsets.py 40"},
      {"name": "pin-data",                  "run": "-m flycns.integrity write data", "nt": true, "manual": true},
      {"name": "battery-seed1",             "run": "scripts/overnight.py seed1"},
      {"name": "battery-seed2",             "run": "scripts/overnight.py seed2"},
      {"name": "battery-signflip05_a",      "run": "scripts/overnight.py signflip05_a"},
      {"name": "battery-signflip05_b",      "run": "scripts/overnight.py signflip05_b"},
      {"name": "battery-signflip10",        "run": "scripts/overnight.py signflip10"},
      {"name": "battery-wscale025",         "run": "scripts/overnight.py wscale025"},
      {"name": "battery-wscale035",         "run": "scripts/overnight.py wscale035"},
      {"name": "battery-wscale040",         "run": "scripts/overnight.py wscale040"},
      {"name": "battery-signflip_targeted", "run": "scripts/overnight.py signflip_targeted", "nt": true},
      {"name": "battery-minweight10",       "run": "scripts/overnight.py minweight10"},
      {"name": "battery-minweight20",       "run": "scripts/overnight.py minweight20"},
      {"name": "battery-null_superclass",   "run": "scripts/overnight.py null_superclass"}
    ]

jobs:
  plan:
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      nt: ${{ steps.m.outputs.nt }}
    steps:
      - id: m
        shell: pwsh
        run: |
          $all = $env:RERUNS | ConvertFrom-Json
          $only = if ("${{ github.ref_name }}" -match "--(.+)$") { $Matches[1] -split "\+" } else { @() }
          $bad = @($only | Where-Object { $_ -notin $all.name })
          if ($bad) { Write-Host "::error title=rerun::unknown: $($bad -join ', '). Choose from: $($all.name -join ', ')"; exit 1 }
          $sel = @($all | Where-Object { if ($only) { $_.name -in $only } else { -not $_.manual } })
          "matrix=" + (ConvertTo-Json -Compress -Depth 4 @{ include = $sel }) >> $env:GITHUB_OUTPUT
          "nt=" + ([bool]@($sel | Where-Object nt).Count).ToString().ToLower() >> $env:GITHUB_OUTPUT
          Write-Host "::notice title=rerun::$($sel.Count) rerun(s): $($sel.name -join ', ')"

  data:
    runs-on: windows-latest
    timeout-minutes: 300
    outputs:
      key: ${{ steps.key.outputs.data }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.lock }
      - id: key
        shell: bash
        run: echo "data=male-cns-v1.0-${{ hashFiles('scripts/fetch_malecns.py', 'scripts/fetch_annotations.py', 'scripts/fetch_dimorphism.py', 'fit/roi_membership.py', 'data/MANIFEST.json') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v5
        with: { path: "data/*.parquet", key: "${{ steps.key.outputs.data }}" }
      - name: neuPrint token present
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        env: { NEUPRINT_TOKEN: "${{ secrets.NEUPRINT_TOKEN }}" }
        run: |
          if (-not $env:NEUPRINT_TOKEN) {
            Write-Host "::error title=neuPrint token::add the repository secret NEUPRINT_TOKEN (Settings, Secrets and variables, Actions)"
            exit 1
          }
      - name: setup.cmd (environment; on the first run also the connectome, annotations and fingerprint)
        shell: cmd
        env: { NEUPRINT_TOKEN: "${{ secrets.NEUPRINT_TOKEN }}" }
        run: setup.cmd
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with: { path: "data/*.parquet", key: "${{ steps.key.outputs.data }}" }

  transmitters:
    needs: [plan, data]
    if: needs.plan.outputs.nt == 'true'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      key: ${{ steps.key.outputs.nt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.lock }
      - uses: actions/cache/restore@v5
        with: { path: "data/*.parquet", key: "${{ needs.data.outputs.key }}", fail-on-cache-miss: true }
      - id: key
        shell: bash
        run: echo "nt=${{ needs.data.outputs.key }}-nt-${{ hashFiles('fit/synapse_nt.py', 'scripts/fetch_bulk.py') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v5
        with: { path: "data/edges_nt.parquet\nresults/nt_confidence.json", key: "${{ steps.key.outputs.nt }}" }
      - shell: cmd
        run: setup.cmd
      - name: menu 24 (fetch the per-T-bar table, then fit/synapse_nt.py)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          foreach ($cmd in "scripts/fetch_bulk.py synapse-nt", "fit/synapse_nt.py") {
            & .venv\Scripts\python.exe @($cmd -split " ") *>> ci-log.txt
            if ($LASTEXITCODE) {
              $t = (Get-Content ci-log.txt -Tail 12) -join " | "
              Write-Host "::error title=transmitters::$cmd exited $LASTEXITCODE :: $t"
              exit 1
            }
          }
          Get-Content ci-log.txt -Tail 30
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with: { path: "data/edges_nt.parquet\nresults/nt_confidence.json", key: "${{ steps.key.outputs.nt }}" }
      - name: push results to rerun-out/${{ github.run_number }}/transmitters
        if: always()
        shell: pwsh
        run: |
          git config user.name "flycns rerun"; git config user.email "flycns-rerun@users.noreply.github.com"
          if (Test-Path results/nt_confidence.json) { git add -- results/nt_confidence.json }
          if (Test-Path ci-log.txt) { git add -f -- ci-log.txt }
          git commit -qm "real-data rerun: transmitters (Actions run ${{ github.run_id }})"
          git push -q -f origin "HEAD:refs/heads/rerun-out/${{ github.run_number }}/transmitters"

  run:
    needs: [plan, data, transmitters]
    # a skipped or failed transmitter table only stops the runs that need it (they refuse without it)
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.data.result == 'success' }}
    name: ${{ matrix.name }}
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.lock }
      - uses: actions/cache/restore@v5
        with: { path: "data/*.parquet", key: "${{ needs.data.outputs.key }}", fail-on-cache-miss: true }
      - if: matrix.nt
        uses: actions/cache/restore@v5
        with: { path: "data/edges_nt.parquet\nresults/nt_confidence.json", key: "${{ needs.transmitters.outputs.key }}", fail-on-cache-miss: true }
      - shell: cmd
        run: setup.cmd
      - name: own branch (scripts that commit and push, like menu 51 and the battery, push here)
        shell: pwsh
        run: |
          git config --global user.name "flycns rerun"; git config --global user.email "flycns-rerun@users.noreply.github.com"
          git checkout -q -B "rerun-out/${{ github.run_number }}/${{ matrix.name }}"
          git push -q -f -u origin "rerun-out/${{ github.run_number }}/${{ matrix.name }}"
      - name: ${{ matrix.run }}
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          & .venv\Scripts\python.exe @("${{ matrix.run }}" -split " ") *> ci-log.txt
          $code = $LASTEXITCODE
          Get-Content ci-log.txt -Tail 60
          if ($code) {
            $t = (Get-Content ci-log.txt -Tail 12) -join " | "
            Write-Host "::error title=${{ matrix.name }}::exit $code :: $t"
            exit $code
          }
          $done = (Get-Content ci-log.txt | Select-String "PASS|FAIL|checks pass|done:" | Select-Object -Last 3) -join " | "
          Write-Host "::notice title=${{ matrix.name }}::$done"
      - name: push results to rerun-out/${{ github.run_number }}/${{ matrix.name }}
        if: always()
        shell: pwsh
        run: |
          git add -A -- results
          if (Test-Path data/MANIFEST.json) { git add -- data/MANIFEST.json }
          if (Test-Path ci-log.txt) { git add -f -- ci-log.txt }
          $logs = @(Get-ChildItem results/overnight/*.log -ErrorAction SilentlyContinue | Resolve-Path -Relative)
          if ($logs) { git add -f -- @logs }
          git diff --cached --quiet
          if ($LASTEXITCODE) { git commit -qm "real-data rerun: ${{ matrix.name }} (Actions run ${{ github.run_id }})" }
          git push -q -f origin "HEAD:refs/heads/rerun-out/${{ github.run_number }}/${{ matrix.name }}"
