name: regression
on:
  push:
    branches: [main]
  pull_request:
jobs:
  toy-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -r requirements.txt
      - name: regression test on the synthetic toy graph
        run: python tests/regression.py
