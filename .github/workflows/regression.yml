name: regression
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"   # weekly: catches breakage from the outside world (runners, package indexes) early
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# flycns runs on Windows only, so every job runs on Windows. No job sets PYTHONUTF8 for the test
# runner itself; flycns sets it for the processes it starts, and one step below runs a script
# directly, as a user might, to prove the code is correct under Windows' default text encoding.
jobs:
  lint:
    # Real errors only: syntax errors, undefined names, duplicate definitions. Style is not enforced.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check --select E9,F63,F7,F82,F811 --output-format github .

  toy-suite:
    name: toy suite (Python ${{ matrix.python }}, ${{ matrix.deps }}, ${{ matrix.engine }} engine)
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # reference environment, compiled engine (the runner has the Microsoft C++ compiler)
          - { python: "3.12", deps: requirements.lock, engine: compiled, codegen: "", expect: cython }
          # the lock must also install from ready-made wheels on the next Python
          - { python: "3.13", deps: requirements.lock, engine: compiled, codegen: "", expect: cython }
          # oldest supported Python, newest compatible packages (the setup fallback path)
          - { python: "3.10", deps: requirements.txt, engine: compiled, codegen: "", expect: cython }
          # a machine without the Microsoft C++ Build Tools: the pure-Python engine, end to end
          - { python: "3.12", deps: requirements.lock, engine: pure-Python, codegen: numpy, expect: numpy }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # full history: staleness and registration-history checks need it
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: install (${{ matrix.deps }}; the lock from ready-made wheels only, as setup does)
        run: |
          pip install ${{ matrix.deps == 'requirements.lock' && '--only-binary=:all: --no-binary=asciitree' || '' }} -r ${{ matrix.deps }}
      - name: regression test on the synthetic toy graph
        run: python tests/regression.py
        env:
          FLYCNS_CODEGEN: ${{ matrix.codegen }}
          FLYCNS_EXPECT_ENGINE: ${{ matrix.expect }}
      - name: a script run directly, under Windows' default encoding (reads é and em dashes)
        run: python benchmarks/summarize.py > $null

  user-path:
    # exactly what people do: setup.cmd --check and the menu through fly.cmd; then the maintainer's
    # menu 51 (update, pin data, core suite, stricter null, commit, push) against a local stand-in for
    # GitHub, on toy data, with every integrity guard active
    name: setup.cmd, fly.cmd and menu 51, as a user runs them
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # full history: menu 51 commits, pulls and pushes like a maintainer's clone
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: .\setup.cmd --check
        shell: cmd
        run: setup.cmd --check
      - name: .\fly.cmd (status, integrity status, quit)
        shell: pwsh
        run: |
          $out = "3`n`n49`n`nq`n" | .\fly.cmd 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw "fly.cmd exited $LASTEXITCODE" }
          foreach ($want in @("neuprint token", "code     commit", "settings ")) {
            if (-not $out.Contains($want)) { throw "fly.cmd output is missing '$want'" }
          }
          if ($out.Contains("Traceback")) { throw "fly.cmd raised an exception" }
      - name: menu 51 end to end against a local remote (toy data)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # every failure, expected or not, posts its evidence to the pull request page as an annotation
          # (Write-Host, so a caller's | Out-Null cannot swallow it)
          function Fail($msg, $detail) {
            $tail = (($detail -split "`n") | Where-Object { $_.Trim() } | Select-Object -Last 12) -join " | "
            Write-Host "::error title=menu 51::$msg :: $tail"
            exit 1
          }
          trap { Fail "unexpected error at line $($_.InvocationInfo.ScriptLineNumber)" "$_" }
          # run a program and stop with its output if it fails. (Not named Git: PowerShell names ignore
          # case, so a function called Git would call itself instead of git.)
          function Must {
            $rest = @($args | Select-Object -Skip 1)
            $out = & $args[0] @rest 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { Fail "$args failed (exit $LASTEXITCODE)" $out }
            $out
          }
          Must git config --global user.name "ci" | Out-Null
          Must git config --global user.email "ci@example.com" | Out-Null
          $w = Join-Path $env:RUNNER_TEMP "maintainer"
          # a pull request is checked out as a detached commit: give the stand-in GitHub a real branch
          Must git branch -f ci-main HEAD | Out-Null
          Must git clone -q --bare -b ci-main . "$w\remote.git" | Out-Null
          Must git clone -q "$w\remote.git" "$w\clone" | Out-Null
          Must cmd /c mklink /J "$w\clone\.venv" "$PWD\.venv" | Out-Null
          Set-Location "$w\clone"
          Must .\.venv\Scripts\python.exe scripts\make_testdata.py | Out-Null
          Copy-Item testdata\*.parquet data\
          Must .\.venv\Scripts\python.exe -m flycns.integrity write data | Out-Null
          # Registrations made on the real connectome do not fit the toy graph; the toy registers its own.
          # Deleting them in a commit would be refused (a deleted registration may not register again), so
          # the stand-in project starts as a fresh history: one commit, this tree, no registrations.
          Must git checkout -q --orphan fresh | Out-Null
          Must git rm -q --cached --ignore-unmatch "results/*/criteria.json" "results/*/registration.json" "results/*/registration_v*.json" | Out-Null
          Get-ChildItem results -Recurse -Include criteria.json, registration.json, registration_v*.json | Remove-Item
          Must git add data/MANIFEST.json | Out-Null
          Must git commit -qm "CI: a fresh project on toy data" | Out-Null
          # a registered test scores only under a committed registration: register the toy's own first,
          # as a maintainer registers before a run (flycns/registry.py)
          $env:FLYCNS_REGISTER_ONLY = "1"
          foreach ($b in @("gf_escape", "auditory", "feeding", "pc1_song", "null_strict")) {
            Must .\.venv\Scripts\python.exe "benchmarks\$b.py" | Out-Null
          }
          Remove-Item Env:FLYCNS_REGISTER_ONLY
          Must git add results | Out-Null
          Must git commit -qm "CI: register the toy's own tests" | Out-Null
          Must git branch -M ci-main | Out-Null
          Must git push -q -f origin ci-main | Out-Null
          Must git branch -q -u origin/ci-main | Out-Null
          $before = [int](Must git -C "$w\remote.git" rev-list --count HEAD).Trim()
          $out = "51`n`nq`n" | .\fly.cmd 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0 -or $out.Contains("STOPPED") -or $out.Contains("Traceback")) {
            # the lines that say why, not the menu that follows them
            $why = ($out -split "`n" | Select-String -Pattern "refuse|STOPPED|Traceback|Error|\[integrity\]|\[registry\]|failed" |
                    Select-Object -Last 12 | ForEach-Object { $_.Line }) -join "`n"
            Fail "menu 51 did not finish" ($(if ($why) { $why } else { $out }))
          }
          # results go to a NEW review branch; the working branch (ci-main) is never pushed
          $after = [int](Must git -C "$w\remote.git" rev-list --count HEAD).Trim()
          $review = @((Must git -C "$w\remote.git" for-each-ref --format="%(refname:short)" refs/heads/review/) -split "`n" |
                      Where-Object { $_.Trim() })
          Write-Output "remote ci-main commits: $before -> $after; review branches: $($review -join ', ')"
          if ($after -ne $before) { Fail "menu 51 pushed to the working branch" $out }
          if ($review.Count -ne 1) { Fail "menu 51 did not push exactly one review branch" $out }
          $last = (Must git -C "$w\remote.git" log -1 --format=%s $review[0].Trim()).Trim()
          if (-not $last.StartsWith("canonical rerun")) { Fail "the review branch does not carry the results ($last)" $out }
          $here = (Must git symbolic-ref --short HEAD).Trim()
          if ($here -ne "ci-main") { Fail "menu 51 left the checkout on $here, not ci-main" $out }
          $dirty = (Must git status --porcelain --untracked-files=no).Trim()
          if ($dirty) { Fail "menu 51 left uncommitted changes" $dirty }
          Write-Host "::notice title=menu 51::update, pinned data, core suite, stricter null, commit to review branch $($review[0].Trim()) and push all verified; ci-main untouched ($before commits)"
