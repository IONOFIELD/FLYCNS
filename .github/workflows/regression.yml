name: regression
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"   # weekly: catches breakage from the outside world (runners, indexes) early
  workflow_dispatch:

jobs:
  lint:
    # Real errors only: syntax errors, undefined names, duplicate definitions. Style is not enforced.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check --select E9,F63,F7,F82,F811 --output-format github .

  toy-suite:
    name: toy suite (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.deps }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # reference environment: requirements.lock, on both supported platforms
          - { os: ubuntu-latest, python: "3.12", deps: requirements.lock }
          - { os: macos-latest,  python: "3.12", deps: requirements.lock }
          # the lock must also hold on the next Python
          - { os: ubuntu-latest, python: "3.13", deps: requirements.lock }
          # oldest supported Python, newest compatible packages (the setup.sh fallback path)
          - { os: ubuntu-latest, python: "3.10", deps: requirements.txt }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install (${{ matrix.deps }})
        run: pip install -r ${{ matrix.deps }}
      - name: regression test on the synthetic toy graph
        run: python tests/regression.py

  container:
    # the frozen reference image: if this passes, `docker build` from this commit reproduces the environment
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flycns .
      - run: docker run --rm flycns python tests/regression.py
